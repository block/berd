[package]
name = "sq-kgoose"
version = "0.7.11"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false

[[bin]]
name = "agent-tools"
path = "src/main.rs"

[[bin]]
name = "bb"
path = "src/bin/bb.rs"

[dependencies]
anyhow = "1"
builderbot-auth = { path = "../crates/builderbot-auth", features = ["blocking-client"] }
clap = { version = "4.5", features = ["env"] }
clap_complete = "4.5"
pbjson = "0.9"
pbjson-types = "0.9"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tiny_http = "0.12"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
url = "2.5"
webbrowser = "1.0"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
pbjson-build = "0.9"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
