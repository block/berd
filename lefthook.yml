# Equivalent of the aaif-goose/goose Husky hooks, using lefthook.
# See: https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    biome-format:
      # Allowlist of biome-supported extensions; safer than a denylist since
      # ignoreUnknown is false and unknown types would cause biome to error.
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --fix {staged_files}
      stage_fixed: true
    check:
      run: just check

pre-push:
  parallel: true
  commands:
    fmt-check:
      run: just fmt-check
    clippy:
      run: just clippy
    check:
      run: just check
    test:
      run: just test
    build:
      run: just build
    tauri-check:
      run: just tauri-check
