[package]
name = "berd-memory"
version = "0.1.0"
edition = "2021"
description = "Berd's memory MCP server — a minimal stdio server exposing consent-gated memory tools over the user's ~/.me/ files."

[[bin]]
name = "berd-memory-mcp"
path = "src/main.rs"

[dependencies]
dirs = "6"
hex = "0.4"
regex = "1"
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
