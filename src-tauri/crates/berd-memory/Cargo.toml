[package]
name = "berd-memory"
version = "0.1.0"
edition = "2021"
description = "Shared Rust core for Berd's consent-gated memory files."

[[bin]]
name = "berd-memory-mcp"
path = "src/main.rs"

[dependencies]
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
fs2 = "0.4"
rand = "0.8"
zeroize = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

same-file = "1"
