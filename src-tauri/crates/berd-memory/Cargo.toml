[package]
name = "berd-memory"
version = "0.1.0"
edition = "2021"
description = "Shared Rust core for Berd's consent-gated memory files."

[dependencies]
dirs = "6"
hex = "0.4"
regex = "1"
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
