[package]
name = "tauri-plugin-berdctl"
version = "0.6.2"
edition = "2021"
links = "tauri-plugin-berdctl"
build = "build.rs"

[lib]
name = "tauri_plugin_berdctl"
path = "src/lib.rs"

[dependencies]
getrandom = { version = "0.4", optional = true }
hex = { version = "0.4", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = { version = "2", optional = true }
tauri = { version = "2", default-features = false }
tokio = { version = "1", features = ["sync", "time", "rt", "net"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[features]
# Without `server` the crate compiles to an inert stub: permissions are still
# generated by build.rs, but no runtime code (including `init`) exists.
server = ["dep:axum", "dep:getrandom", "dep:hex", "dep:libc", "dep:subtle", "dep:windows-sys"]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
