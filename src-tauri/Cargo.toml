[package]
name = "Goose"
version = "0.4.12"
description = "Goose desktop app"
authors = ["Block, Inc."]
edition = "2021"
default-run = "Goose"

[lib]
name = "goose_internal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit workspace so the goosectl plugin is a member: `cargo test -p
# <plugin> --features ...` only works for workspace members. app-test-driver
# stays excluded (a plain path dependency, as before this workspace existed).
[workspace]
members = ["crates/goosectl", "plugins/goosectl"]
exclude = ["plugins/app-test-driver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
doctor = { git = "https://github.com/block/builderbot", rev = "31d08d924f15bc4bb857b3d764dc9f9c4b20cd40" }
etcetera = "0.11.0"
ignore = "0.4.25"
infer = "0.19.0"
libc = "0.2"
log = "0.4.29"
mime_guess = "2"
futures-util = "0.3"
nucleo-matcher = "0.3"
percent-encoding = "2"
plist = "1"
portable-pty = "0.9.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-goosectl = { path = "plugins/goosectl" }
tauri-plugin-app-test-driver = { path = "plugins/app-test-driver" }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.50.0", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSAlert", "NSButton", "NSControl", "NSCell", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSError", "NSFileManager", "NSObject", "NSProcessInfo", "NSString", "NSURL"] }
objc2-user-notifications = "0.3.2"


[features]
goosectl = ["tauri-plugin-goosectl/server"]
app-test-driver = []
devtools = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"
