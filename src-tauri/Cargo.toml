[package]
name = "Goose"
version = "0.1.0"
description = "Goose desktop app"
authors = ["Block, Inc."]
edition = "2021"
default-run = "Goose"

[lib]
name = "goose_internal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
doctor = { git = "https://github.com/block/builderbot", rev = "6ee2eb8400c7d398ea0c9a8f209873502ff3944b" }
etcetera = "0.11.0"
ignore = "0.4.25"
infer = "0.19.0"
libc = "0.2"
log = "0.4.29"
mime_guess = "2"
futures-util = "0.3"
portable-pty = "0.9.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-app-test-driver = { path = "plugins/app-test-driver" }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }


[features]
app-test-driver = []
devtools = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"
