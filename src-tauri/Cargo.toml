[package]
name = "goose-internal"
version = "0.1.0"
description = "Goose Internal desktop app"
authors = ["Block, Inc."]
edition = "2021"

[[bin]]
name = "goose-internal-tauri"
path = "src/main.rs"

[lib]
name = "goose_internal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
doctor = { git = "https://github.com/block/builderbot", rev = "8e1c3ec145edc0df5f04b4427cfd758378036862" }
ignore = "0.4.25"
log = "0.4.29"
mime_guess = "2"
futures-util = "0.3"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-app-test-driver = { path = "plugins/app-test-driver" }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }


[features]
app-test-driver = []

[dev-dependencies]
tempfile = "3"
