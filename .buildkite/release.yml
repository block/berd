agents:
  xcode: "26.3.0"

env:
  BERD_RELEASE_CHANNEL: "internal"
  BERD_UPDATER_ENDPOINT: "https://global.block-artifacts.com/artifactory/mdx/goose-internal/latest.json"
  APPLE_TEAM_ID: "EYF346PHUG"

  MACOS_ENVIRONMENT_XCODE_VERSION: "26.3.0"
  MACOS_ENVIRONMENT_RUBY_VERSION: "3.3.9"

# Official releases are intentionally static: they build/sign once, then publish
# the updater feed and GitHub release from the signed artifacts.
steps:
  - input: ":mac: Cut a Berd release"
    key: "release-input"
    fields:
      - text: "version"
        key: "version"
        hint: "Semver for this release (e.g. 0.2.0). Becomes the v<version> tag on this repo."
        required: true
      - select: "Promote to auto-update channel?"
        key: "publish_latest"
        hint: "Updates latest.json so every installed Berd auto-updates to this build on next poll. Set to No for test builds."
        default: "true"
        required: true
        options:
          - label: "Yes"
            value: "true"
          - label: "No"
            value: "false"

  - label: ":mac: Build & sign macOS"
    key: "build-macos"
    depends_on: "release-input"
    command: |
      source scripts/buildkite/release/release-inputs.sh
      load_buildkite_release_inputs version
      load_optional_buildkite_release_inputs databricks_host fast_model_id
      ./scripts/release/build-macos.sh
    plugins:
      - squareup/apple-codesign#v1:
          identity: "Developer ID Application: Block, Inc. (EYF346PHUG)"
          artifacts:
            - path: "release/macos/Berd.app"
              entitlements: release/macos/entitlements.plist
            - path: "release/macos/Berd.app.zip"
              package:
                from: "release/macos/Berd.app"
              sign: false
              notarize: false
              staple: false
            - path: "release/macos/Berd.dmg"
              package:
                from: "release/macos/Berd.app"
                volname: "Berd"
      - squareup/upload-mobile-release#v3:
          skip_bundle_version_validation: true
          team_ids:
            - "EYF346PHUG"
          mobile_releases:
            - id: "berd-macos"
              project: "berd"
              platform: "mac_zip"
              variant: "release"
              file: "release/macos/Berd.app.zip"
              version: "scripts/buildkite/release/release-version.sh"

  - label: ":arrows_counterclockwise: Publish updater feed"
    key: "publish-updater"
    depends_on:
      - "build-macos"
    command: ./scripts/buildkite/release/publish-updater.sh

  - label: ":github: Publish GitHub release"
    key: "publish"
    depends_on:
      - "build-macos"
    command: ./scripts/buildkite/release/publish-release.sh
