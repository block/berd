agents:
  xcode: "26.3.0"

env:
  GOOSE2_UPDATER_ENDPOINT: "https://global.block-artifacts.com/artifactory/mdx/goose-internal/latest.json"

  MACOS_ENVIRONMENT_XCODE_VERSION: "26.3.0"
  MACOS_ENVIRONMENT_RUBY_VERSION: "3.3.9"
# The macos-environment plugin activates Xcode and sets up RVM/bundler so the
# upload-mobile-release plugin's pre-command can find `fastlane` if it ever
# needs to. Goose only builds macOS, but the plugin's signing/upload helpers
# still rely on the environment it primes.
common:
steps:
  - input: ":mac: Cut a Goose release"
    key: "release-input"
    fields:
      - text: "version"
        key: "version"
        hint: "Semver for this release (e.g. 0.2.0). Becomes the v<version> tag on this repo."
        required: true
      - select: "Promote to auto-update channel?"
        key: "publish_latest"
        hint: "Updates latest.json so every installed Goose auto-updates to this build on next poll. Set to No for test builds."
        default: "true"
        required: true
        options:
          - label: "Yes"
            value: "true"
          - label: "No"
            value: "false"

  - label: ":mac: Build & sign macOS"
    key: "build-macos"
    depends_on: "release-input"
    command: ./scripts/buildkite/release/build-macos.sh
    plugins:
      - squareup/apple-codesign#v1:
          identity: "Developer ID Application: Block, Inc. (EYF346PHUG)"
          artifacts:
            - path: "release/macos/Goose.app"
              entitlements: src-tauri/entitlements.plist
            - path: "release/macos/Goose.app.zip"
              package:
                from: "release/macos/Goose.app"
              sign: false
              notarize: false
              staple: false
            - path: "release/macos/Goose.dmg"
              package:
                from: "release/macos/Goose.app"
                volname: "Goose"
      - squareup/upload-mobile-release#v3:
          skip_bundle_version_validation: true
          team_ids:
            - "EYF346PHUG"
          mobile_releases:
            - id: "goose2-macos"
              project: "goose2"
              platform: "mac_zip"
              variant: "release"
              file: "release/macos/Goose.app.zip"
              version: "scripts/buildkite/release/release-version.sh"

  - label: ":arrows_counterclockwise: Publish updater feed"
    key: "publish-updater"
    depends_on:
      - "build-macos"
    command: ./scripts/buildkite/release/publish-updater.sh
  - label: ":github: Publish GitHub release"
    key: "publish"
    depends_on:
      - "build-macos"
    command: ./scripts/buildkite/release/publish-release.sh
