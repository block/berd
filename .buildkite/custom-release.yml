agents:
  xcode: "26.3.0"

env:
  APPLE_TEAM_ID: "EYF346PHUG"

  MACOS_ENVIRONMENT_XCODE_VERSION: "26.3.0"
  MACOS_ENVIRONMENT_RUBY_VERSION: "3.3.9"

# Custom releases are isolated from the official updater and GitHub release
# flows. They build/sign once, then upload the signed zip + dmg to a named
# Artifactory path.
steps:
  - input: ":mac: Cut a custom Berd release"
    key: "release-input"
    fields:
      - text: "version"
        key: "version"
        hint: "Semver base for this custom build (e.g. 0.2.0). The built app version is <version>-<custom_name>."
        required: true
      - text: "Custom build name"
        key: "custom_name"
        hint: "Lowercase slug for this custom build (e.g. acme-demo). Suffixes the app version and namespaces the Artifactory path."
        required: true
      - text: "Custom config overrides"
        key: "custom_config"
        hint: 'JSON override for feature-level runtime sections only (featureToggles, doctor, feedback), e.g. {"featureToggles":{"voiceDictation":false,"telemetry":false}}. Use custom_vite_env for build-time gates like VITE_SECURITY_ML.'
        default: "{}"
        required: false
      - text: "Custom build env overrides"
        key: "custom_vite_env"
        hint: 'JSON object of VITE_* build env overrides plus CUSTOM_BUNDLED_AGENTS and DISABLE_BLOCK_NPM_REGISTRY, e.g. {"VITE_BYO_KEY_PROVIDERS":"1","DISABLE_BLOCK_NPM_REGISTRY":"1"}. Bundled agents default to "block,builderbot". VITE_APP_VERSION and VITE_ENVIRONMENT are not allowed.'
        default: "{}"
        required: false
      - select: "Disable bb CLI PATH install?"
        key: "disable_bb_cli"
        hint: "Yes omits the bb CLI PATH-install from this custom build (Cargo no-bb-cli-install)."
        default: "false"
        required: true
        options:
          - label: "No"
            value: "false"
          - label: "Yes"
            value: "true"
  - label: ":mac: Build & sign custom macOS"
    key: "build-macos"
    depends_on: "release-input"
    env:
      BUILD_KIND: "custom"
    command: ./scripts/buildkite/release/build-macos.sh
    plugins:
      - squareup/apple-codesign#v1:
          identity: "Developer ID Application: Block, Inc. (EYF346PHUG)"
          artifacts:
            - path: "release/macos/Berd.app"
              entitlements: release/macos/entitlements.plist
            - path: "release/macos/Berd.app.zip"
              package:
                from: "release/macos/Berd.app"
              sign: false
              notarize: false
              staple: false
            - path: "release/macos/Berd.dmg"
              package:
                from: "release/macos/Berd.app"
                volname: "Berd"

  - label: ":artifactory: Upload custom artifacts"
    key: "publish-custom-artifacts"
    depends_on:
      - "build-macos"
    env:
      BUILD_KIND: "custom"
    command: ./scripts/buildkite/release/publish-custom-artifacts.sh
