env:
  CI: "true"
  FORCE_COLOR: "1"

steps:
  - label: ":typescript: JS, SDK, and unit tests"
    key: "js"
    command: "scripts/buildkite/js-checks.sh"
    artifact_paths:
      - "coverage/**/*"
      - "test-results/**/*"

  - label: ":rust: Tauri Rust checks"
    key: "rust"
    command: "scripts/buildkite/rust-checks.sh"

  - label: ":terminal: BuilderBot CLI lint"
    key: "bb-cli-lint"
    command: "cd bb-cli && TEST_RUNNER=lint script/ci"

  - label: ":terminal: BuilderBot CLI tests"
    key: "bb-cli-test"
    command: "cd bb-cli && TEST_RUNNER=test script/ci"

  - label: ":playwright: Transcript virtualization"
    key: "transcript-virtualization"
    command: "scripts/buildkite/transcript-virtualization.sh"
    depends_on:
      - "js"
    artifact_paths:
      - "transcript-playwright-report/**/*"
      - "test-results/**/*"

  - label: ":package: Frontend build smoke"
    key: "build"
    command: "scripts/buildkite/build-smoke.sh"
    depends_on:
      - "js"
    artifact_paths:
      - "dist/**/*"
