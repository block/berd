name: Unsigned Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-latest
          - platform: Windows x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install just on Windows
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just@1.40.0

      - name: Activate Hermit on macOS
        if: runner.os == 'macOS'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Build unsigned macOS DMG
        if: runner.os == 'macOS'
        env:
          VERSION: 0.0.0-unsigned
          BUILD_KIND: official
          BERD_RELEASE_CHANNEL: disabled
        run: |
          set -euo pipefail
          scripts/release/build-macos.sh
          scripts/package-macos-dmg.sh release/macos/Berd.app release/macos/Berd-unsigned.dmg

      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BERD_RELEASE_CHANNEL: disabled
        run: |
          $ErrorActionPreference = 'Stop'
          just setup-windows
          just bundle-windows nsis
          New-Item -ItemType Directory -Force release/windows | Out-Null
          Import-Module "$env:GITHUB_WORKSPACE/scripts/windows/WindowsDev.psm1" -Force -DisableNameChecking
          $targetDir = Get-TauriCargoTargetDir
          $nsisDir = Join-Path $targetDir 'x86_64-pc-windows-msvc/release/bundle/nsis'
          $installer = Get-ChildItem -LiteralPath $nsisDir -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "Windows bundle produced no NSIS installer under $nsisDir" }
          Copy-Item $installer.FullName release/windows/Berd-unsigned-setup.exe

      - name: Upload unsigned package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: berd-unsigned-${{ runner.os }}
          path: |
            release/macos/Berd-unsigned.dmg
            release/windows/Berd-unsigned-setup.exe
          if-no-files-found: error
          retention-days: 7
