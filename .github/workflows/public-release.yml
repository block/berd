name: Public macOS Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v<semver> tag to recover; select this same tag as the run ref
        required: true
        type: string

permissions:
  contents: read

env:
  PUBLIC_CHANNEL_CONFIG: scripts/release/public-channel.json

jobs:
  setup:
    name: Verify immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      repository: ${{ steps.channel.outputs.repository }}
      rolling_tag: ${{ steps.channel.outputs.rolling_tag }}
      platform: ${{ steps.channel.outputs.platform }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      staged_assets_ready: ${{ steps.assets.outputs.ready }}
    steps:
      - name: Check out requested immutable ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$PUSH_TAG"
          else
            TAG="$DISPATCH_TAG"
          fi
          # shellcheck source=scripts/release/lib.sh
          source scripts/release/lib.sh
          validate_release_tag "$TAG" || {
            echo "::error::Expected an existing v<semver> tag without build metadata; got '$TAG'"
            exit 1
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${GITHUB_REF:-}" != "refs/tags/$TAG" ]]; then
            echo "::error::Recovery dispatch must run from refs/tags/$TAG; got '${GITHUB_REF:-<unset>}'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag-bound source on origin
        id: source
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/release/github/verify-release-ref.sh "$TAG"
          echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Load public channel boundary
        id: channel
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/release/lib.sh
          source scripts/release/lib.sh
          load_public_channel "$PUBLIC_CHANNEL_CONFIG"
          REPOSITORY="$PUBLIC_REPOSITORY"
          ROLLING_TAG="$PUBLIC_ROLLING_TAG"
          PLATFORM="$PUBLIC_PLATFORM"
          [[ "$ACTUAL_REPOSITORY" == "$REPOSITORY" ]] || {
            echo "::error::Workflow repository $ACTUAL_REPOSITORY does not match configured public repository $REPOSITORY"
            exit 1
          }
          [[ "$PLATFORM" == "darwin-aarch64" ]] || {
            echo "::error::Unsupported public platform: $PLATFORM"
            exit 1
          }
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "rolling_tag=$ROLLING_TAG" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Create immutable versioned release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ steps.channel.outputs.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            EXISTING_TAG=$(gh release view "$TAG" --repo "$REPOSITORY" --json tagName --jq .tagName)
            [[ "$EXISTING_TAG" == "$TAG" ]] || {
              echo "::error::Existing release tag mismatch: $EXISTING_TAG"
              exit 1
            }
            echo "Using existing versioned release $TAG"
          else
            PRERELEASE=()
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE=(--prerelease --latest=false)
            fi
            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --target "$SOURCE_SHA" \
              --title "Berd v$VERSION" \
              --notes "$(printf 'Berd v%s\n\nSource commit: `%s`\n' "$VERSION" "$SOURCE_SHA")" \
              "${PRERELEASE[@]}"
          fi

          RELEASE_TAG_REF=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          RELEASE_TAG_TYPE=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          if [[ "$RELEASE_TAG_TYPE" == "tag" ]]; then
            RELEASE_TAG_REF=$(gh api "repos/$REPOSITORY/git/tags/$RELEASE_TAG_REF" --jq .object.sha)
          fi
          [[ "$RELEASE_TAG_REF" == "$SOURCE_SHA" ]] || {
            echo "::error::Versioned release $TAG resolves to $RELEASE_TAG_REF, expected $SOURCE_SHA"
            exit 1
          }

      - name: Check for a complete staged updater payload
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ steps.channel.outputs.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PLATFORM: ${{ steps.channel.outputs.platform }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="$(source scripts/release/lib.sh; release_archive_name "$VERSION" "$PLATFORM")"
          RELEASE_ASSETS=$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
          READY=true
          for NAME in \
            "Berd_${VERSION}_${PLATFORM}.app.zip" \
            "Berd_${VERSION}_${PLATFORM}.dmg" \
            "$ARCHIVE_NAME" \
            "$ARCHIVE_NAME.sig" \
            "$ARCHIVE_NAME.sha256"; do
            if ! grep -Fxq "$NAME" <<< "$RELEASE_ASSETS"; then
              READY=false
            fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [[ "$READY" == "true" ]]; then
            echo "Versioned release already has a complete staged payload; recovery will reverify it without rebuilding."
          fi

  stage-macos:
    name: Build, sign, and stage macOS arm64
    needs: setup
    if: needs.setup.outputs.staged_assets_ready != 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      TAG: ${{ needs.setup.outputs.tag }}
      SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
      REPOSITORY: ${{ needs.setup.outputs.repository }}
      PLATFORM: ${{ needs.setup.outputs.platform }}
      BERD_RELEASE_CHANNEL: public
      BERD_UPDATER_ENDPOINT: https://github.com/${{ needs.setup.outputs.repository }}/releases/download/${{ needs.setup.outputs.rolling_tag }}/latest.json
      BERD_UPDATER_PUBLIC_KEY: ${{ vars.BERD_PUBLIC_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound source again
        run: scripts/release/github/verify-release-ref.sh "$TAG"

      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Require public updater configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BERD_UPDATER_PUBLIC_KEY:?BERD_PUBLIC_UPDATER_PUBLIC_KEY repository variable is required}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY repository secret is required}"
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD+x}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret must be set"
            exit 1
          fi

      - name: Build existing macOS arm64 product unsigned
        env:
          BUILD_KIND: official
        run: |
          set -euo pipefail
          scripts/release/build-macos.sh
          scripts/package-macos-dmg.sh release/macos/Berd.app release/macos/Berd.dmg

      - name: Sign, notarize, and staple the app through OIDC
        id: codesign
        uses: block/apple-codesign-action@679535d1ab7c5a7c18e6f9afcba3464512cc3dde # v1.1.0
        with:
          osx-codesign-role: ${{ secrets.OSX_CODESIGN_ROLE }}
          codesign-s3-bucket: ${{ secrets.CODESIGN_S3_BUCKET }}
          unsigned-artifact-path: release/macos/Berd.dmg
          entitlements-plist-path: release/macos/entitlements.plist
          artifact-name: berd-${{ needs.setup.outputs.source_sha }}-${{ github.run_id }}-arm64

      - name: Package and reverify signed release assets
        env:
          SIGNED_APP_ZIP: ${{ steps.codesign.outputs.signed-artifact-path }}
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNED_APP_ZIP:?apple-codesign-action returned no signed app zip}"
          : "${SIGNED_DMG:?apple-codesign-action returned no signed DMG}"
          scripts/release/github/prepare-public-assets.sh \
            "$SIGNED_APP_ZIP" "$SIGNED_DMG" "$VERSION" "$PLATFORM" \
            "$RUNNER_TEMP/public-release-assets" "$GITHUB_ENV"

      - name: Upload immutable versioned assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="$(source scripts/release/lib.sh; release_archive_name "$VERSION" "$PLATFORM")"
          scripts/release/github/upload-immutable-assets.sh "$REPOSITORY" "$TAG" \
            "$asset_dir/$app_zip_name" \
            "$asset_dir/$dmg_name" \
            "$asset_dir/$ARCHIVE_NAME" \
            "$asset_dir/$ARCHIVE_NAME.sig" \
            "$asset_dir/$ARCHIVE_NAME.sha256"

      - name: Record staged release
        run: |
          ARCHIVE_NAME="$(source scripts/release/lib.sh; release_archive_name "$VERSION" "$PLATFORM")"
          DIGEST=$(awk 'NR == 1 {print $1}' "$asset_dir/$ARCHIVE_NAME.sha256")
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Public release staged

          - Version: \`$VERSION\`
          - Tag: \`$TAG\`
          - Source: \`$SOURCE_SHA\`
          - Platform: \`$PLATFORM\`
          - Updater SHA-256: \`$DIGEST\`
          - Versioned release: https://github.com/$REPOSITORY/releases/tag/$TAG

          Promotion re-downloads these assets and requires approval; it does not rebuild.
          SUMMARY

  promote:
    name: Approve and promote public updater feed
    needs: [setup, stage-macos]
    if: always() && needs.setup.result == 'success' && (needs.stage-macos.result == 'success' || needs.stage-macos.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 30
    environment: public-release
    concurrency:
      group: berd-public-release
      cancel-in-progress: false
    permissions:
      contents: write
      deployments: read
      actions: read
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
      BERD_PUBLIC_UPDATER_PUBLIC_KEY: ${{ vars.BERD_PUBLIC_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound source again
        run: scripts/release/github/verify-release-ref.sh "$TAG"

      - name: Activate Hermit
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Preflight environment approval record access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          APPROVER=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | unique | join(", ")')
          [[ -n "$APPROVER" ]] || {
            echo "::error::GitHub returned no approved reviewer for this environment-gated run"
            exit 1
          }
          echo "environment_approver=$APPROVER" >> "$GITHUB_ENV"

      - name: Verify staged immutable assets against release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ needs.setup.outputs.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          PLATFORM: ${{ needs.setup.outputs.platform }}
          EXPECTED_TAG: ${{ needs.setup.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
        run: scripts/release/github/verify-versioned-release.sh "$EXPECTED_TAG" "$EXPECTED_SOURCE_SHA"

      - name: Download, validate, and promote staged updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/release/github/promote-public-updater.sh "$TAG" "$SOURCE_SHA" "$RUNNER_TEMP/promotion-summary.md"
          cat "$RUNNER_TEMP/promotion-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Record workflow and environment approval
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          - Workflow run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID
          - Environment approval: $environment_approver
          SUMMARY
